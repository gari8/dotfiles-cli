name: release

# A change to version.toml on main creates the tag v<version> and releases it.
# Tagging and releasing run in the same workflow because a tag pushed with
# GITHUB_TOKEN does not trigger other workflows. Pushing a v* tag by hand
# also releases.
on:
  push:
    branches: [main]
    paths: [version.toml]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Tag from version.toml
        id: tag
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          version=$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' version.toml)
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error file=version.toml::version must be semver like 1.2.3, got '$version'"
            exit 1
          fi
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to release"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "$tag"
          git push origin "$tag"
          echo "release=true" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v5
        if: ${{ startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.release == 'true' }}
        with:
          go-version-file: go.mod

      - uses: goreleaser/goreleaser-action@v6
        if: ${{ startsWith(github.ref, 'refs/tags/') || steps.tag.outputs.release == 'true' }}
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
